<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./style.css">
    <title>TaDandoAula</title>
</head>

<body class="surf-sauce flex min-h-screen flex-col bg-cyan-200">
    <header>
        <div class="flex h-24 items-center gap-3 px-4 sm:h-36 sm:gap-4 sm:px-6"
            style="background-image: url('./maderaescura.jpg'), url('./madeiraclara.jpg'), url('./maderaescura.jpg'); background-size: 100% 33.33%; background-position: top, center, bottom; background-repeat: no-repeat;">
            <img src="./taDandoAula.png" alt="Logo Ta dando Aula" class="h-16 w-16 object-contain sm:h-24 sm:w-24">
            <div>
                <h1 class="surf-sauce text-2xl font-black text-slate-800 sm:text-4xl">Ta dando Aula</h1>
                <h2 class="surf-sauce text-lg text-yellow-400 sm:text-2xl">aulas de surf</h2>
            </div>
        </div>
    </header>

    <main class="mx-auto w-full max-w-lg flex-1 px-4 py-8 sm:px-6 sm:py-10">
        <h2 class="text-3xl font-black text-slate-800">Criar conta</h2>
        <p class="mt-2 text-slate-700">Preencha seus dados para criar sua conta.</p>

        <form class="mt-6 space-y-4"
            onsubmit="alert('Estamos com muita procura! Seu pedido entrou na fila de espera. A sua onda chegará!'); this.reset(); return false;">
            <div>
                <label for="nome">Nome completo</label>
                <input id="nome" type="text" placeholder="Seu nome" required
                    class="mt-1 w-full rounded border border-cyan-800 bg-white p-3">
            </div>

            <div>
                <label for="email">E-mail</label>
                <input id="email" type="email" placeholder="voce@email.com" required
                    class="mt-1 w-full rounded border border-cyan-800 bg-white p-3">
            </div>

            <div>
                <label for="senha">Senha</label>
                <input id="senha" type="password" placeholder="Sua senha" required
                    class="mt-1 w-full rounded border border-cyan-800 bg-white p-3">
            </div>

            <div>
                <label for="cpf">CPF</label>
                <input id="cpf" type="text" inputmode="numeric" minlength="11" maxlength="11" pattern="[0-9]{11}"
                    placeholder="Somente números" required
                    class="mt-1 w-full rounded border border-cyan-800 bg-white p-3">
            </div>

            <button type="submit"
                class="rounded bg-yellow-500 p-3 font-bold text-slate-800 hover:bg-yellow-400">Criar
                conta</button>
        </form>
        <button>
            <a href="PlanosDeAssinatura.html"
                class="mt-6 inline-block bg-yellow-500 px-6 py-3 font-bold text-slate-800 hover:bg-yellow-400">Voltar
                para os planos</a>
        </button>
    </main>
    <footer class="mt-auto">
        <div class="bg-slate-800 text-white text-center p-6">
            <p>&copy; 2023 TadandoAula. Todos os direitos reservados.</p>
        </div>
    </footer>
</body>

</html>
